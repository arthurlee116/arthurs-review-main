[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "arthurs-review-semantic-service"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy==2.3.5",
  "onnxruntime==1.27.0",
  "tokenizers==0.22.2"
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["semantic_service*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
