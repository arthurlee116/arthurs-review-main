name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, test, and deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.28.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Prepare deployment secrets
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          PRODUCTION_ENV: ${{ secrets.PRODUCTION_ENV }}
        run: |
          test -n "$DEPLOY_SSH_PRIVATE_KEY"
          test -n "$PRODUCTION_ENV"

          mkdir -p ~/.ssh deploy
          chmod 700 ~/.ssh

          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          DEPLOY_HOST="${DEPLOY_HOST:-187.124.247.64}"
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

          cat > ~/.ssh/config <<EOF
          Host $DEPLOY_HOST
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF
          chmod 600 ~/.ssh/config

          printf '%s\n' "$PRODUCTION_ENV" > deploy/production.env
          chmod 600 deploy/production.env

      - name: Deploy to VPS
        env:
          APP_DIR: ${{ vars.DEPLOY_APP_DIR }}
          REMOTE: ${{ vars.DEPLOY_REMOTE }}
        run: |
          REMOTE="${REMOTE:-root@187.124.247.64}" \
          APP_DIR="${APP_DIR:-/opt/arthurs-review}" \
          ./scripts/deploy.sh
