name: Deploy

# Tests run locally (scripts/verify-local.sh, wired as the pre-push hook) against
# the same production image stack. CI only builds, pushes and deploys; the remote
# release still refuses to finish unless /healthz and /version match, and rolls back.
on:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "tests/**"
      - "e2e/**"
      - "semantic/tests/**"
  workflow_dispatch:

concurrency:
  group: production-maintenance
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve image names and content tags
        run: |
          image_repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          eval "$(scripts/image-tags.sh)"
          {
            echo "IMAGE_REPO=${image_repo}"
            echo "IMAGE_TAG=${image_repo}:${GITHUB_SHA}"
            echo "BASE_TAG=${BASE_TAG}"
            echo "SEMANTIC_REPO=${image_repo}-semantic"
            echo "SEMANTIC_IMAGE_TAG=${image_repo}-semantic:${SEMANTIC_TAG}"
            echo "SEMANTIC_TAG=${SEMANTIC_TAG}"
          } >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Find reusable base and semantic images
        id: reuse
        run: |
          exists() { docker buildx imagetools inspect "$1" >/dev/null 2>&1 && echo true || echo false; }
          echo "base=$(exists "${IMAGE_REPO}:base-build-${BASE_TAG}")" >> "$GITHUB_OUTPUT"
          echo "semantic=$(exists "${SEMANTIC_IMAGE_TAG}")" >> "$GITHUB_OUTPUT"

      # Only when docker/base.Dockerfile changes: compiles libvips (several minutes).
      - name: Build base runtime image
        if: steps.reuse.outputs.base != 'true'
        uses: docker/build-push-action@v7
        with:
          context: docker
          file: docker/base.Dockerfile
          target: runtime
          push: true
          platforms: linux/amd64
          tags: ${{ env.IMAGE_REPO }}:base-runtime-${{ env.BASE_TAG }}
          provenance: false

      - name: Build base build image
        if: steps.reuse.outputs.base != 'true'
        uses: docker/build-push-action@v7
        with:
          context: docker
          file: docker/base.Dockerfile
          target: build
          push: true
          platforms: linux/amd64
          tags: ${{ env.IMAGE_REPO }}:base-build-${{ env.BASE_TAG }}
          provenance: false

      # Only when the semantic service or its model lock changes.
      - name: Build locked semantic image
        if: steps.reuse.outputs.semantic != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: semantic.Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ env.SEMANTIC_IMAGE_TAG }}
          build-args: |
            SEMANTIC_TAG=${{ env.SEMANTIC_TAG }}
          provenance: false

      # Registry cache never expires (the GHA cache drops entries after 7 idle
      # days, which turned roughly every other deploy into a cold build).
      - name: Build and push the app image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ env.IMAGE_TAG }}
          build-args: |
            BASE_IMAGE=${{ env.IMAGE_REPO }}
            BASE_TAG=${{ env.BASE_TAG }}
            SITE_URL=https://blog.leesaitool.com
            NEXT_PUBLIC_CLOUDFLARE_WEB_ANALYTICS_TOKEN=${{ vars.NEXT_PUBLIC_CLOUDFLARE_WEB_ANALYTICS_TOKEN }}
            GIT_COMMIT_SHA=${{ github.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE_REPO }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_REPO }}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true
          provenance: false

      - name: Resolve pushed digests
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          SEMANTIC_IMAGE_DIGEST="$(docker buildx imagetools inspect "$SEMANTIC_IMAGE_TAG" --format '{{json .Manifest}}' | jq -er '.digest')"
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$SEMANTIC_IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          EXPECTED_SCHEMA_VERSION="$(find src/lib/db/migrations -maxdepth 1 -name '[0-9][0-9][0-9]_*.sql' -print | wc -l | tr -d '[:space:]')"
          [[ "$EXPECTED_SCHEMA_VERSION" =~ ^[1-9][0-9]*$ ]]
          APP_IMAGE="${IMAGE_REPO}@${IMAGE_DIGEST}"
          SEMANTIC_IMAGE="${SEMANTIC_REPO}@${SEMANTIC_IMAGE_DIGEST}"
          echo "IMAGE_DIGEST=$IMAGE_DIGEST" >> "$GITHUB_ENV"
          echo "APP_IMAGE=$APP_IMAGE" >> "$GITHUB_ENV"
          echo "SEMANTIC_IMAGE_DIGEST=$SEMANTIC_IMAGE_DIGEST" >> "$GITHUB_ENV"
          echo "SEMANTIC_IMAGE=$SEMANTIC_IMAGE" >> "$GITHUB_ENV"
          echo "EXPECTED_SCHEMA_VERSION=$EXPECTED_SCHEMA_VERSION" >> "$GITHUB_ENV"
          printf 'App image: `%s`\n' "$APP_IMAGE" >> "$GITHUB_STEP_SUMMARY"
          printf 'Semantic image: `%s`\n' "$SEMANTIC_IMAGE" >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare deployment secrets
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_SSH_PASSPHRASE: ${{ secrets.DEPLOY_SSH_PASSPHRASE }}
          PRODUCTION_ENV: ${{ secrets.PRODUCTION_ENV }}
          ADMIN_PASSWORD_HASH: ${{ secrets.ADMIN_PASSWORD_HASH }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          WORKER_REVALIDATE_SECRET: ${{ secrets.WORKER_REVALIDATE_SECRET }}
        run: |
          test -n "$DEPLOY_SSH_PRIVATE_KEY"
          test -n "$PRODUCTION_ENV"
          test -n "$ADMIN_PASSWORD_HASH"
          test -n "$SESSION_SECRET"
          test -n "$WORKER_REVALIDATE_SECRET"

          mkdir -p ~/.ssh deploy
          chmod 700 ~/.ssh

          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          eval "$(ssh-agent -s)"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          if [ -n "${DEPLOY_SSH_PASSPHRASE:-}" ]; then
            cat > "$RUNNER_TEMP/ssh-askpass" <<'EOF'
          #!/usr/bin/env sh
          printf '%s\n' "$DEPLOY_SSH_PASSPHRASE"
          EOF
            chmod 700 "$RUNNER_TEMP/ssh-askpass"
            DISPLAY=none SSH_ASKPASS="$RUNNER_TEMP/ssh-askpass" SSH_ASKPASS_REQUIRE=force ssh-add ~/.ssh/deploy_key </dev/null
          else
            ssh-add ~/.ssh/deploy_key
          fi

          DEPLOY_HOST="${DEPLOY_HOST:-72.60.195.46}"
          if [ "$DEPLOY_HOST" = "72.60.195.46" ]; then
            # Rotated 2026-09 (VPS host keys regenerated). Re-derive with:
            # ssh-keygen -lf <(ssh-keyscan -t ed25519 72.60.195.46)
            printf '%s\n' '72.60.195.46 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDffFanc/LlnVjKZ/7oV1xiT5nhrFStrLI9wh9iOXwPl' >> ~/.ssh/known_hosts
          else
            for attempt in 1 2 3 4 5; do
              if ssh-keyscan -T 30 -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts; then
                break
              fi
              if [ "$attempt" = 5 ]; then
                echo "Failed to scan SSH host key for $DEPLOY_HOST" >&2
                exit 1
              fi
              sleep 5
            done
          fi

          cat > ~/.ssh/config <<EOF
          Host $DEPLOY_HOST
            IdentityFile ~/.ssh/deploy_key
            IdentityAgent $SSH_AUTH_SOCK
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF
          chmod 600 ~/.ssh/config

          printf '%s\n' "$PRODUCTION_ENV" > deploy/production.env
          printf 'ADMIN_PASSWORD_HASH=%s\n' "$ADMIN_PASSWORD_HASH" >> deploy/production.env
          printf 'SESSION_SECRET=%s\n' "$SESSION_SECRET" >> deploy/production.env
          printf 'WORKER_REVALIDATE_SECRET=%s\n' "$WORKER_REVALIDATE_SECRET" >> deploy/production.env
          chmod 600 deploy/production.env

      - name: Deploy to VPS
        env:
          APP_DIR: ${{ vars.DEPLOY_APP_DIR }}
          REMOTE: ${{ vars.DEPLOY_REMOTE }}
          APP_IMAGE: ${{ env.APP_IMAGE }}
          SEMANTIC_IMAGE: ${{ env.SEMANTIC_IMAGE }}
          DEPLOY_COMMIT_SHA: ${{ github.sha }}
          IMAGE_DIGEST: ${{ env.IMAGE_DIGEST }}
          SEMANTIC_IMAGE_DIGEST: ${{ env.SEMANTIC_IMAGE_DIGEST }}
          EXPECTED_SCHEMA_VERSION: ${{ env.EXPECTED_SCHEMA_VERSION }}
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REMOTE="${REMOTE:-root@72.60.195.46}" \
          APP_DIR="${APP_DIR:-/opt/arthurs-review}" \
          ./scripts/deploy.sh
