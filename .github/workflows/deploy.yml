name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, test, and deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.28.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Next.js build
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('package.json', 'next.config.*', 'postcss.config.*', 'tsconfig.json', 'src/**/*', 'public/**/*') }}
          restore-keys: |
            ${{ runner.os }}-next-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Prepare deployment secrets
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_SSH_PASSPHRASE: ${{ secrets.DEPLOY_SSH_PASSPHRASE }}
          PRODUCTION_ENV: ${{ secrets.PRODUCTION_ENV }}
        run: |
          test -n "$DEPLOY_SSH_PRIVATE_KEY"
          test -n "$PRODUCTION_ENV"

          mkdir -p ~/.ssh deploy
          chmod 700 ~/.ssh

          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          eval "$(ssh-agent -s)"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          if [ -n "${DEPLOY_SSH_PASSPHRASE:-}" ]; then
            cat > "$RUNNER_TEMP/ssh-askpass" <<'EOF'
          #!/usr/bin/env sh
          printf '%s\n' "$DEPLOY_SSH_PASSPHRASE"
          EOF
            chmod 700 "$RUNNER_TEMP/ssh-askpass"
            DISPLAY=none SSH_ASKPASS="$RUNNER_TEMP/ssh-askpass" SSH_ASKPASS_REQUIRE=force ssh-add ~/.ssh/deploy_key </dev/null
          else
            ssh-add ~/.ssh/deploy_key
          fi

          DEPLOY_HOST="${DEPLOY_HOST:-72.60.195.46}"
          if [ "$DEPLOY_HOST" = "72.60.195.46" ]; then
            printf '%s\n' '72.60.195.46 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPW6DVc3HbWdUhmPpQxR2De5SrdmSsmYyxm+RrHgedSl' >> ~/.ssh/known_hosts
          else
            for attempt in 1 2 3 4 5; do
              if ssh-keyscan -T 30 -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts; then
                break
              fi
              if [ "$attempt" = 5 ]; then
                echo "Failed to scan SSH host key for $DEPLOY_HOST" >&2
                exit 1
              fi
              sleep 5
            done
          fi

          cat > ~/.ssh/config <<EOF
          Host $DEPLOY_HOST
            IdentityFile ~/.ssh/deploy_key
            IdentityAgent $SSH_AUTH_SOCK
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF
          chmod 600 ~/.ssh/config

          printf '%s\n' "$PRODUCTION_ENV" > deploy/production.env
          chmod 600 deploy/production.env

      - name: Deploy to VPS
        env:
          APP_DIR: ${{ vars.DEPLOY_APP_DIR }}
          REMOTE: ${{ vars.DEPLOY_REMOTE }}
        run: |
          REMOTE="${REMOTE:-root@72.60.195.46}" \
          APP_DIR="${APP_DIR:-/opt/arthurs-review}" \
          ./scripts/deploy.sh
