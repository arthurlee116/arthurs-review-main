services:
  app:
    image: arthurs-review-app:local
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        SITE_URL: https://blog.leesaitool.com
    env_file:
      - path: ./production.env
        required: false
        format: raw
    environment:
      DATA_DIR: /data
      SITE_URL: https://blog.leesaitool.com
    volumes:
      - /var/www/arthurs-review/data:/data
    restart: unless-stopped
    expose:
      - "3000"

  worker:
    image: arthurs-review-app:local
    env_file:
      - path: ./production.env
        required: false
        format: raw
    environment:
      DATA_DIR: /data
      SITE_URL: https://blog.leesaitool.com
      INTERNAL_APP_URL: http://app:3000
    volumes:
      - /var/www/arthurs-review/data:/data
    command: ["pnpm", "jobs:work"]
    restart: unless-stopped
    depends_on:
      - app

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8444:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
  caddy_logs:
