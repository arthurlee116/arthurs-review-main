global
    log /dev/log local0
    maxconn 4096
    daemon

defaults
    log global
    mode tcp
    option tcplog
    timeout connect 10s
    timeout client 2m
    timeout server 2m

frontend http_80
    bind *:80
    mode http
    http-request redirect scheme https code 308

frontend tls_443
    bind *:443
    tcp-request inspect-delay 5s
    tcp-request content accept if { req.ssl_hello_type 1 }
    acl sni_blog req.ssl_sni -i blog.leesaitool.com
    acl sni_studio req.ssl_sni -i studio.blog.leesaitool.com
    acl sni_reality req.ssl_sni -i www.bing.com
    use_backend caddy_https if sni_blog
    use_backend caddy_https if sni_studio
    use_backend xray_reality if sni_reality
    default_backend xray_reality

backend caddy_https
    server caddy_https 127.0.0.1:8444 send-proxy-v2 check

backend xray_reality
    server xray_reality 127.0.0.1:9443 check
